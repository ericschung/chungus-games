<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leo's Reef Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* One deliberate look: a bright undersea construction site. Navy ink outlines, sea blues, hard-hat yellow,
   and big round buttons a four-year-old can hit. Everything is spoken, so text is mostly for grown-ups. */
:root {
  --ink: #26314f; --sea: #1f86c4; --sea-deep: #135e93; --foam: #e9fbff; --hat: #ffc62e; --hat-deep: #f0a500;
  --coral: #ff6f91; --go: #34c26b; --panel: rgba(255, 255, 255, 0.94);
  --font: "Fredoka", "Arial Rounded MT Bold", "Avenir Next", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--ink); font-family: var(--font); overscroll-behavior: none; }
button { font-family: var(--font); touch-action: manipulation; cursor: pointer; }
[hidden] { display: none !important; }
.screen { position: fixed; inset: 0; overflow: hidden; }
svg { display: block; }
.tappable { cursor: pointer; }

/* ---------- start */
#start { background: radial-gradient(120% 90% at 50% 0%, #9fe6ff 0%, #3bb3e6 45%, #1f86c4 100%); display: grid; place-items: center; }
#start .wrap { display: grid; justify-items: center; gap: 2vh; text-align: center; padding: max(16px, env(safe-area-inset-left)); }
#start h1 { margin: 0; font-weight: 700; font-size: clamp(54px, 11vmin, 120px); line-height: 0.9; color: #fff; text-shadow: 0 5px 0 var(--sea-deep), 0 10px 24px rgba(0, 0, 0, 0.25); }
#start h1 span { color: var(--hat); }
#start img { height: 42vh; max-width: 80vw; object-fit: contain; filter: drop-shadow(0 12px 18px rgba(0, 40, 80, 0.35)); }
.big { font-weight: 700; font-size: clamp(30px, 5vmin, 46px); color: var(--ink); background: var(--hat); border: 6px solid #fff; border-radius: 999px;
  padding: 0.35em 1.6em 0.4em; box-shadow: 0 8px 0 var(--hat-deep), 0 14px 30px rgba(0, 0, 0, 0.25); }
.big:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--hat-deep); }

/* ---------- hub */
#town { position: absolute; inset: 0; width: 100%; height: 100%; }
#town .ray { animation: ray 9s ease-in-out infinite alternate; }
@keyframes ray { from { opacity: 0.06; } to { opacity: 0.2; } }
#town .nextplot { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
/* top left of the town: the day (tap to pick any day) and All games */
#topLeft { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: flex; gap: 10px; align-items: center; z-index: 2; }
#dayPill, #allGames { border: 0; background: var(--panel); border-radius: 999px; padding: 8px 16px 8px 10px; display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: clamp(18px, 2.6vmin, 26px); color: var(--ink); box-shadow: 0 6px 18px rgba(0, 40, 80, 0.2); }
#dayPill svg:first-child { width: 40px; height: 40px; }
#dayPill svg:last-child { width: 18px; height: 18px; margin-left: -2px; }
#allGames svg { width: 34px; height: 34px; }
#dayPill:active, #allGames:active { transform: translateY(2px); }
/* pick a day: all 21, each with the building it brings */
#curtain .card.tall { max-height: 92vh; overflow-y: auto; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; width: min(88vw, 900px); }
.daytile { position: relative; border: 0; border-radius: 18px; background: #fff; padding: 6px 4px 8px; display: grid; justify-items: center; gap: 2px;
  box-shadow: 0 4px 0 #cfe3f0; font-weight: 700; font-size: clamp(14px, 2vmin, 18px); color: var(--ink); }
.daytile > svg { width: 100%; height: auto; aspect-ratio: 340 / 310; }
.daytile:not(.done) > svg { filter: grayscale(0.85) opacity(0.55); }
.daytile.now { background: #fff6cf; box-shadow: 0 0 0 4px var(--hat), 0 4px 0 #cfe3f0; }
.daytile .check { position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; border-radius: 50%; background: var(--go); border: 3px solid #fff; display: grid; place-items: center; }
.daytile .check svg { width: 62%; height: 62%; }
.daytile:active { transform: translateY(2px); }
#gear { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); width: 54px; height: 54px; border-radius: 50%;
  border: 0; background: rgba(255, 255, 255, 0.5); display: grid; place-items: center; }
#gear svg { width: 30px; height: 30px; }
#gear .ring { position: absolute; inset: -4px; }
#jobsCol { position: absolute; top: 13vh; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.8vh, 30px); }
#jobs { display: flex; gap: clamp(14px, 3vw, 40px); }
/* the day is done: start the next one now */
.nextday { display: flex; align-items: center; gap: 12px; font: 700 clamp(24px, 3.8vmin, 36px) var(--font); color: #fff; background: #34c26b; border: 6px solid #fff;
  border-radius: 999px; padding: 10px 26px 10px 32px; box-shadow: 0 6px 0 #23924f, 0 10px 22px rgba(0, 40, 80, 0.25); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  animation: throb 1.8s ease-in-out infinite; }
.nextday svg { width: 1em; height: 1em; }
.nextday:active { animation: none; transform: translateY(4px); box-shadow: 0 2px 0 #23924f; }
#start .anew { border: 0; border-radius: 999px; padding: 9px 22px; background: rgba(255, 255, 255, 0.32); color: #fff; font: 600 clamp(17px, 2.4vmin, 22px) var(--font); }
.btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.job { position: relative; width: clamp(118px, 19vmin, 190px); border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 8px; }
.job .orb { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 7px solid #fff; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #c9f2ff 40%, #78d3f5 100%); box-shadow: 0 10px 0 rgba(10, 70, 120, 0.35), 0 18px 30px rgba(0, 40, 80, 0.25);
  animation: bob 3.2s ease-in-out infinite; }
.job:nth-child(2) .orb { animation-delay: -0.8s; } .job:nth-child(3) .orb { animation-delay: -1.6s; } .job:nth-child(4) .orb { animation-delay: -2.4s; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.job .orb svg { width: 88%; height: 88%; }
.job .name { background: var(--panel); border-radius: 999px; padding: 4px 14px 5px; font-weight: 700; font-size: clamp(15px, 2.1vmin, 21px); white-space: nowrap;
  box-shadow: 0 4px 12px rgba(0, 40, 80, 0.18); }
.job .check { position: absolute; top: -6px; right: -6px; width: 34%; aspect-ratio: 1; border-radius: 50%; background: var(--go); border: 5px solid #fff;
  display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25); }
.job .check svg { width: 62%; height: 62%; }
.job.done .orb { filter: saturate(0.7) brightness(1.06); }
.job:active .orb { transform: scale(0.95); }
#hubLeo { position: absolute; left: max(10px, 1.5vw); bottom: 1vh; height: 46vh; max-height: 520px; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; filter: drop-shadow(0 10px 12px rgba(0, 40, 60, 0.35)); }
.bubble { background: #fff; border-radius: 26px; padding: 14px 22px 15px 14px; display: flex; align-items: center; gap: 12px; font-weight: 600;
  font-size: clamp(17px, 2.5vmin, 25px); line-height: 1.25; box-shadow: 0 8px 22px rgba(0, 40, 80, 0.22); min-width: 0; }
.bubble .who { flex: none; width: 1.9em; height: 1.9em; }
.bubble .who svg { width: 100%; height: 100%; }
.bubble .txt { min-width: 0; }
#bubble { position: absolute; left: calc(max(10px, 1.5vw) + 20vh + 18px); bottom: 4vh; max-width: min(52vw, 600px); transition: opacity 0.6s, transform 0.6s; }
#bubble.gone { opacity: 0; transform: translateY(14px) scale(0.96); pointer-events: none; }
#bubble .who { width: clamp(108px, 18vh, 160px); height: clamp(108px, 18vh, 160px); margin: -70px -4px -22px -40px; filter: drop-shadow(0 6px 8px rgba(0, 40, 80, 0.3)); }
#bubble .who svg { overflow: visible; }

/* ---------- play */
#play { background: linear-gradient(#8fe0ff, #2a9fd8 55%, #1f86c4); }
#stage { position: absolute; left: 0; right: 0; bottom: 0; top: clamp(78px, 12vh, 112px); }
#stage > svg { width: 100%; height: 100%; touch-action: none; }
#playbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); }
.round { flex: none; width: clamp(56px, 8vmin, 72px); height: clamp(56px, 8vmin, 72px); border-radius: 50%; border: 5px solid #fff; background: var(--hat);
  display: grid; place-items: center; box-shadow: 0 5px 0 var(--hat-deep); padding: 0; }
.round svg { width: 58%; height: 58%; }
.round:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--hat-deep); }
/* the Back button sits on the floor below the scene (the scene stops above it, its floor runs on underneath);
   a tap anywhere else while someone talks skips ahead */
#play { --dock: clamp(70px, 10vh, 96px); }
#stage > svg { height: calc(100% - var(--dock)); overflow: visible; clip-path: inset(0 0 calc(-1 * var(--dock)) 0); }
#dock { position: absolute; left: 0; bottom: 0; height: var(--dock); display: flex; align-items: center;
  padding: 0 0 env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); }
.dbtn { height: clamp(56px, 8.2vh, 74px); min-width: clamp(130px, 17vw, 190px); padding: 0 clamp(16px, 2.4vw, 28px); border-radius: 999px; border: 5px solid #fff;
  background: var(--hat); box-shadow: 0 5px 0 var(--hat-deep), 0 8px 16px rgba(0, 40, 80, 0.2); display: flex; align-items: center; justify-content: center; gap: 10px;
  font: 700 clamp(20px, 3vmin, 28px) Fredoka, system-ui, sans-serif; color: #26314f; cursor: pointer; transition: opacity 0.2s; }
.dbtn svg { width: 1.15em; height: 1.15em; flex: none; }
.dbtn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 2px 0 var(--hat-deep); }
.dbtn[disabled] { opacity: 0.4; cursor: default; box-shadow: none; }
#pbubble { flex: 1; margin: 0 auto; max-width: 820px; position: relative; }
#pbubble .who { display: none; }
#pbubble::before { content: ""; position: absolute; left: -13px; top: 50%; margin-top: -13px; border: 13px solid transparent; border-right-color: #fff; border-left: 0; }
#host[hidden] + #pbubble::before { display: none; }
/* the game's character hangs down from the bar, beside what it says */
#host { flex: none; align-self: flex-start; width: clamp(104px, 19vh, 168px); height: clamp(104px, 19vh, 168px); margin: -4px -14px -120px -6px; z-index: 2;
  filter: drop-shadow(0 6px 8px rgba(0, 40, 80, 0.3)); }
#play.small-host #host { width: clamp(84px, 13vh, 120px); height: clamp(84px, 13vh, 120px); }
#host svg { width: 100%; height: 100%; overflow: visible; }
.cheers { display: flex; align-items: flex-end; gap: 2vw; }
.cheers svg.side { width: 22vh; height: 22vh; overflow: visible; }
#dots { flex: none; display: flex; gap: 7px; }
#dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); border: 3px solid #fff; }
#dots i.on { background: var(--hat); }
#playLeo { position: absolute; left: max(6px, 1vw); bottom: -40vh; height: 34vh; pointer-events: none; transition: bottom 0.35s cubic-bezier(.2, 1.4, .4, 1);
  filter: drop-shadow(0 10px 12px rgba(0, 40, 60, 0.35)); }
.meet { position: absolute; inset: 0 0 var(--dock) 0; display: grid; place-items: center; pointer-events: none; z-index: 3; animation: meetIn 0.5s cubic-bezier(.2, 1.4, .4, 1); }
.meet svg { width: min(52vh, 62vw, 440px); height: min(52vh, 62vw, 440px); overflow: visible; filter: drop-shadow(0 12px 16px rgba(0, 40, 80, 0.3)); }
#play.meeting #host { visibility: hidden; }
.meet.bye { transition: opacity 0.35s, transform 0.35s; opacity: 0; transform: translate(-30%, -40%) scale(0.3); }
@keyframes meetIn { from { opacity: 0; transform: scale(0.4); } }
#playLeo.show { bottom: calc(var(--dock) - 8px); }

/* ---------- celebrations */
#curtain { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10, 60, 100, 0.45); z-index: 20; }
#curtain .card { background: var(--panel); border-radius: 36px; padding: 18px 34px 26px; display: grid; justify-items: center; gap: 8px; text-align: center;
  box-shadow: 0 20px 60px rgba(0, 20, 50, 0.35); animation: popin 0.5s cubic-bezier(.2, 1.5, .4, 1); max-width: 92vw; }
@keyframes popin { from { transform: scale(0.6); opacity: 0; } }
#curtain h2 { margin: 0; font-size: clamp(30px, 6vmin, 56px); }
#curtain .art { width: min(60vmin, 520px); height: min(42vmin, 360px); }
#curtain img { height: 30vh; }

/* ---------- his pick, talk time */
#curtain .card.wide { max-width: min(94vw, 980px); }
.picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 6px; width: min(90vw, 900px); }
.picker .job { width: 100%; }
@media (orientation: portrait) { .picker { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.job.pick .orb { background: radial-gradient(circle at 50% 40%, #fff8d6, #ffd75a); }
#musicBtn { position: absolute; top: max(12px, env(safe-area-inset-top)); right: calc(max(16px, env(safe-area-inset-right)) + 66px); width: 54px; height: 54px;
  border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.5); display: grid; place-items: center; padding: 0; }
#musicBtn svg { width: 32px; height: 32px; }
#talkBtn { position: absolute; top: max(12px, env(safe-area-inset-top)); right: calc(max(16px, env(safe-area-inset-right)) + 132px); width: 54px; height: 54px;
  border-radius: 50%; border: 0; background: #ffd23f; box-shadow: 0 4px 0 #d9a420; padding: 9px; animation: throb 1.6s ease-in-out infinite; }
#talkBtn svg { width: 100%; height: 100%; }
.talkfor { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #5a6b85; font-size: 16px; }
ul.talk { margin: 4px 0 6px; padding-left: 22px; text-align: left; display: grid; gap: 8px; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; line-height: 1.4; max-width: 40em; }
#curtain .close { border: 0; border-radius: 14px; background: #34c26b; color: #fff; font: 600 20px var(--font); padding: 10px 26px; box-shadow: 0 4px 0 #23924f; }
#curtain .close.alt { background: #e3f1fa; color: var(--ink); box-shadow: 0 4px 0 #b9d0e0; }
#parents .plan { border-radius: 12px; padding: 10px 12px; background: #f3f8fb; }
#parents .plan.now { background: #fff6d6; box-shadow: inset 0 0 0 2px #ffc62e; }
#parents .plan span { color: #5a6b85; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; margin-left: 6px; }
#parents .plan p { margin-top: 2px; }

/* ---------- no sound yet: one tap switches the iPad's voice on */
#soundChip { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(10, 60, 100, 0.4); border: 0; padding: 16px;
  font-family: var(--font); color: var(--ink); -webkit-tap-highlight-color: transparent; }
#soundChip .card { background: #fff; border-radius: 30px; padding: 22px 30px 24px; display: grid; justify-items: center; gap: 10px; text-align: center;
  box-shadow: 0 20px 60px rgba(0, 20, 50, 0.35); animation: popin 0.4s cubic-bezier(.2, 1.5, .4, 1); max-width: min(92vw, 520px); }
#soundChip svg { width: 92px; height: 92px; animation: throb 1.1s ease-in-out infinite; }
@keyframes throb { 50% { transform: scale(1.12); } }
#soundChip b { font-size: clamp(26px, 4.6vmin, 40px); }
#soundChip small { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.45; color: #5a6b85; }

/* ---------- grown-ups */
#parents { background: #f3f8fb; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#parents .page { max-width: 880px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; gap: 18px; }
#parents h2 { margin: 0; font-size: 30px; }
#parents h3 { margin: 0 0 6px; font-size: 20px; }
#parents p, #parents li { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.5; margin: 0; }
#parents section { background: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(0, 40, 80, 0.08); min-width: 0; }
#parents table { width: 100%; border-collapse: collapse; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; }
#parents td, #parents th { text-align: left; padding: 7px 6px; border-bottom: 1px solid #e3edf3; }
#parents .tablewrap { overflow-x: auto; }
#parents .row { display: flex; gap: 10px; flex-wrap: wrap; }
#parents .btn { border: 0; border-radius: 12px; padding: 10px 16px; font-size: 16px; font-weight: 600; background: #e3f1fa; color: var(--ink); }
#parents .btn.warn { background: #ffe1e1; }
#parents .bar { height: 14px; border-radius: 7px; background: var(--hat); }

@media (orientation: portrait) {
  #jobsCol { top: 9vh; }
  .days { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  #jobs { display: grid; grid-template-columns: repeat(3, auto); gap: 3vh 5vw; }
  .job { width: clamp(120px, 23vw, 200px); }
  #hubLeo { height: 30vh; }
  #bubble { left: calc(max(10px, 1.5vw) + 13vh + 18px); bottom: 3vh; max-width: 62vw; }
}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reef Crew">
<meta name="theme-color" content="#1f86c4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div id="app">
  <section id="start" class="screen">
    <div class="wrap">
      <h1>Leo's<br><span>Reef Crew</span></h1>
      <img src="art/leo_wave.webp" alt="Leo in his hard hat, waving">
      <button id="go" class="big">Start</button>
      <button id="anew" class="anew" hidden>Start a new town</button>
    </div>
  </section>
  <section id="hub" class="screen" hidden>
    <svg id="town" viewBox="0 0 1240 900" preserveAspectRatio="xMidYMax slice"></svg>
    <div id="topLeft"><button id="dayPill"></button><button id="allGames" aria-label="All games: play any game"></button></div>
    <div id="jobsCol"><div id="jobs"></div><button id="nextDay" class="nextday" hidden></button></div>
    <img id="hubLeo" src="art/leo_idle.webp" alt="Leo" draggable="false">
    <div id="bubble" class="bubble"><span class="who"></span><span class="txt"></span></div>
    <button id="gear" aria-label="Grown-ups: press and hold"></button>
    <button id="talkBtn" hidden aria-label="Talk time ideas for grown-ups"></button>
    <button id="musicBtn" aria-label="Music"></button>
  </section>
  <section id="play" class="screen" hidden>
    <div id="stage"></div>
    <header id="playbar">
      <button id="home" class="round" aria-label="Back to the town"></button>
      <div id="host"></div>
      <div id="pbubble" class="bubble"><span class="who"></span><span class="txt"></span></div>
      <div id="dots"></div>
    </header>
    <nav id="dock" aria-label="Hear the last direction again">
      <button id="dBack" class="dbtn" aria-label="Back: hear the last direction again"><span>Back</span></button>
    </nav>
    <img id="playLeo" src="art/leo_cheer.webp" alt="">
  </section>
  <section id="parents" class="screen" hidden><div class="page" id="ppage"></div></section>
  <div id="curtain" hidden></div>
  <button id="soundChip" hidden aria-label="Tap to hear the crew"><span class="card">
    <svg viewBox="-50 -50 100 100"><circle r="48" fill="#ffd23f"/><path d="M-30 -12 L-14 -12 L4 -28 L4 28 L-14 12 L-30 12 Z" fill="#26314f" stroke="#26314f" stroke-width="5" stroke-linejoin="round"/><path d="M16 -14 Q25 0 16 14 M25 -25 Q41 0 25 25" fill="none" stroke="#26314f" stroke-width="7" stroke-linecap="round"/></svg>
    <b>Tap to hear the crew</b>
    <small>No sound after tapping? Turn the iPad's volume up and make sure Silent Mode is off.</small>
  </span></button>
